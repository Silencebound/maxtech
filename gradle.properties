org.gradle.jvmargs=-Xmx3G -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Per-mod versions (semver, independent releases; PRD 5.8).
lib_version=0.15.0
storage_version=0.9.0
farms_version=0.1.0

# The Lib range Storage declares in neoforge.mods.toml: exactly one Lib minor, because Storage uses Lib internals
# (docs/workflow.md, Versions). Third-party addons on the api jar declare a wider range of their own.
lib_version_range=[0.15,0.16)

# The public repository: displayURL and issueTrackerURL (<url>/issues) in both neoforge.mods.toml. The one place to
# change if the repository gets another name.
public_repo_url=https://github.com/Silencebound/maxtech
