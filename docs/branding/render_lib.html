<!doctype html><meta charset="utf-8"><style>html,body{margin:0;padding:0;overflow:hidden;background:#000}canvas{display:block}</style><canvas id="c" width="512" height="512"></canvas><script>
const hex = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const mix = (a, b, f) => [a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f, a[2] + (b[2] - a[2]) * f];
const css = c => `rgb(${c.map(Math.round).join(',')})`;
const BASE = hex('#1d6f84'), MID = hex('#3fc3e0'), HI = hex('#bff6ff'), DARK = hex('#14171b');
const PLATE = ['#23272d', '#2d3238', '#1c2025'].map(hex), CUT = hex('#121519'), EDGE = hex('#7a7f87');
const QUAD = ['##..#..', '#...#..', '..###.#', '....#.#', '###.#..', '..#...#', '..#.###'];
const sh = k => k < .25 ? mix(DARK, BASE, k * 4) : k < .6 ? mix(BASE, MID, (k - .25) / .35) : mix(MID, HI, (k - .6) / .4);
/* The controller face (design 1, plate B) as a 16 x 16 texture, frozen at a bright moment of the glow. sides: which edges drop the frame. */
function face(sides = [false, false, false, false], phase = 1.2) {
  const c = document.createElement('canvas'); c.width = c.height = 16; const g = c.getContext('2d'), id = g.createImageData(16, 16);
  for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) { const mx = Math.min(x, 15 - x), my = Math.min(y, 15 - y), u = 7.5 - mx, v = 7.5 - my;
    let col; if (mx >= 1 && my >= 1 && QUAD[my - 1][mx - 1] === '#') { const k = Math.max(0, Math.cos((u + v) * .55 - phase)) ** 3; col = sh(.25 + .75 * (.15 + .85 * k)); }
    else if (u < 1.2 && v < 1.2) col = sh(.95);
    else { const n = (((mx * 73856093) ^ (my * 19349663)) >>> 0) % 11; col = PLATE[n === 0 ? 1 : n === 1 ? 2 : 0]; }
    const [T, R, B, L] = sides; if ((y === 0 && !T) || (y === 15 && !B) || (x === 0 && !L) || (x === 15 && !R)) col = EDGE;
    const o = (y * 16 + x) * 4; id.data[o] = col[0]; id.data[o + 1] = col[1]; id.data[o + 2] = col[2]; id.data[o + 3] = 255; }
  g.putImageData(id, 0, 0); return c;
}
function iso(g, blocks, cx, cy, S) {
  const has = (x, y, z) => blocks.some(b => b[0] === x && b[1] === y && b[2] === z), open = (x, y, z, n) => has(x, y, z) && !has(x + n[0], y + n[1], z + n[2]);
  const P = (x, y, z) => [cx + (x - z) * 16 * S, cy + (x + z) * 8 * S - y * 16 * S]; g.imageSmoothingEnabled = false;
  for (const b of blocks.slice().sort((p, q) => (p[0] + p[2]) - (q[0] + q[2]) || p[1] - q[1])) { const [x, y, z] = b;
    const faces = [['top', [0, 1, 0], [open(x, y, z - 1, [0, 1, 0]), open(x + 1, y, z, [0, 1, 0]), open(x, y, z + 1, [0, 1, 0]), open(x - 1, y, z, [0, 1, 0])]],
      ['front', [0, 0, 1], [open(x, y + 1, z, [0, 0, 1]), open(x + 1, y, z, [0, 0, 1]), open(x, y - 1, z, [0, 0, 1]), open(x - 1, y, z, [0, 0, 1])]],
      ['right', [1, 0, 0], [open(x, y + 1, z, [1, 0, 0]), open(x, y, z - 1, [1, 0, 0]), open(x, y - 1, z, [1, 0, 0]), open(x, y, z + 1, [1, 0, 0])]]];
    for (const [f, n, sides] of faces) { if (has(x + n[0], y + n[1], z + n[2])) continue; const t = face(sides); g.save();
      if (f === 'top') { const [px, py] = P(x, y + 1, z); g.setTransform(S, S / 2, -S, S / 2, px, py); }
      else if (f === 'front') { const [px, py] = P(x, y + 1, z + 1); g.setTransform(S, S / 2, 0, S, px, py); }
      else { const [px, py] = P(x + 1, y + 1, z + 1); g.setTransform(S, -S / 2, 0, S, px, py); }
      g.drawImage(t, 0, 0); g.fillStyle = f === 'front' ? 'rgba(0,0,0,.12)' : f === 'right' ? 'rgba(0,0,0,.32)' : 'rgba(0,0,0,0)'; g.fillRect(0, 0, 16, 16); g.restore(); } }
}
const FONT = { M: ['10001', '11011', '10101', '10101', '10001', '10001', '10001'], T: ['11111', '00100', '00100', '00100', '00100', '00100', '00100'] };
function text(g, s, x, y, px, colour, shadow) { [...s].forEach((ch, k) => FONT[ch].forEach((row, r) => [...row].forEach((b, c) => { if (b !== '1') return;
  if (shadow) { g.fillStyle = shadow; g.fillRect(x + (k * 6 + c) * px + px, y + r * px + px, px, px); } g.fillStyle = colour; g.fillRect(x + (k * 6 + c) * px, y + r * px, px, px); }))); }
function tile(g, s, colour = '#1c2025') { const p = s / 32; g.fillStyle = '#0f1215'; g.fillRect(0, 0, s, s); g.fillStyle = colour; g.fillRect(p, p, s - 2 * p, s - 2 * p);
  g.fillStyle = '#3a4048'; g.fillRect(p, p, s - 2 * p, p); g.fillRect(p, p, p, s - 2 * p); g.fillStyle = '#121519'; g.fillRect(p, s - 2 * p, s - 2 * p, p); g.fillRect(s - 2 * p, p, p, s - 2 * p); }
function badge(g, s) { const p = s / 64, w = 26 * p, h = 13 * p, x = s - w - 4 * p, y = s - h - 4 * p;
  g.fillStyle = '#0f1215'; g.fillRect(x - p, y - p, w + 2 * p, h + 2 * p); g.fillStyle = '#1c2025'; g.fillRect(x, y, w, h); g.fillStyle = css(MID); g.fillRect(x, y, w, p); text(g, 'MT', x + 2 * p, y + 3 * p, 1.6 * p, '#e8fbff'); }
function glow(g, x, y, r, a = .35) { const gr = g.createRadialGradient(x, y, 0, x, y, r); gr.addColorStop(0, `rgba(63,195,224,${a})`); gr.addColorStop(1, 'rgba(63,195,224,0)'); g.fillStyle = gr; g.fillRect(x - r, y - r, 2 * r, 2 * r); }
const flat = (g, s, scale, ox, oy, sides) => { g.imageSmoothingEnabled = false; g.drawImage(face(sides), ox, oy, 16 * scale, 16 * scale); };

const OPTIONS = [
  ['A', 'Runic controller block + MT badge', 'The controller as a 3D block with its runic face on every side, the family badge in the corner. Recommended.', (g, s) => { tile(g, s); glow(g, s / 2, s / 2, s * .45, .25); iso(g, [[0, 0, 0]], s / 2, s * .5, s * .024); badge(g, s); }],
  ['B', 'Runic controller block', 'The same block without the badge: the classic mod-list look.', (g, s) => { tile(g, s); glow(g, s / 2, s / 2, s * .45, .25); iso(g, [[0, 0, 0]], s / 2, s * .5, s * .026); }],
  ['C', 'Small multiblock', 'Three controller blocks in an L with connected frames, showing that the controller grows.', (g, s) => { tile(g, s); glow(g, s / 2, s / 2, s * .45, .2); iso(g, [[0, 0, 0], [1, 0, 0], [0, 1, 0]], s * .44, s * .55, s * .016); badge(g, s); }],
  ['D', 'Flat sigil', 'The controller face itself, big and flat: simple and very readable at 64 px.', (g, s) => { g.fillStyle = '#0f1215'; g.fillRect(0, 0, s, s); flat(g, s, s / 16, 0, 0); }],
  ['E', 'Sigil seal', 'The sigil inside a glowing ring on the dark tile, like a stamp or seal.', (g, s) => { tile(g, s); glow(g, s / 2, s / 2, s * .42, .35); g.strokeStyle = css(MID); g.lineWidth = s / 32; g.beginPath(); g.arc(s / 2, s / 2, s * .4, 0, Math.PI * 2); g.stroke();
      g.save(); g.beginPath(); g.arc(s / 2, s / 2, s * .34, 0, Math.PI * 2); g.clip(); flat(g, s, s * .68 / 16, s * .16, s * .16, [true, true, true, true]); g.restore(); }],
  ['F', 'Block with cable', 'The controller block with a glowing glass cable running out of it: storage network at a glance.', (g, s) => { tile(g, s); glow(g, s * .42, s * .45, s * .4, .22);
      const S = s * .02; g.save(); g.translate(s * .62, s * .64); g.transform(1, .5, 0, 1, 0, 0); g.fillStyle = 'rgba(214,230,234,.45)'; g.fillRect(0, -2 * S * 2, s * .34, 4 * S * 2); g.fillStyle = css(MID); g.fillRect(0, -S, s * .34, 2 * S); g.restore();
      iso(g, [[0, 0, 0]], s * .4, s * .46, S); badge(g, s); }],
  ['G', 'MT monogram in runes', 'The letters MT carved as glowing grooves into a plate, in the sigil\'s style. Works for the whole MaxTech family, including Lib.', (g, s) => { tile(g, s, '#23272d'); glow(g, s / 2, s / 2, s * .4, .25);
      const p = s / 26; text(g, 'MT', s / 2 - 5.5 * p, s / 2 - 3.5 * p, p, css(MID), '#121519'); g.fillStyle = css(HI); g.fillRect(s / 2 - 5.5 * p, s / 2 - 3.5 * p, p, p); }],
  ['H', 'Shield badge', 'A shield shape in graphite with the sigil inside, a bit like a guild crest.', (g, s) => { g.fillStyle = '#0f1215'; g.fillRect(0, 0, s, s);
      const shield = () => { g.beginPath(); g.moveTo(s * .14, s * .1); g.lineTo(s * .86, s * .1); g.lineTo(s * .86, s * .55); g.quadraticCurveTo(s * .86, s * .82, s / 2, s * .94); g.quadraticCurveTo(s * .14, s * .82, s * .14, s * .55); g.closePath(); };
      shield(); g.fillStyle = css(MID); g.fill(); g.save(); g.translate(s * .03, s * .03); g.scale(.94, .94); shield(); g.fillStyle = '#23272d'; g.fill(); g.clip(); flat(g, s, s * .62 / 16, s * .19, s * .14, [true, true, true, true]); g.restore(); }],
  ['I', 'Glowing glass cable knot', 'Four glass cables meet in a junction with tier dots, in the new cable look: says "network" rather than "controller".', (g, s) => { tile(g, s); glow(g, s / 2, s / 2, s * .4, .3);
      const w = s * .16, c = s / 2; g.fillStyle = 'rgba(214,230,234,.35)'; g.fillRect(s * .08, c - w / 2, s * .84, w); g.fillRect(c - w / 2, s * .08, w, s * .84);
      g.fillStyle = css(MID); g.fillRect(s * .08, c - w / 6, s * .84, w / 3); g.fillRect(c - w / 6, s * .08, w / 3, s * .84); g.fillStyle = '#1c2025'; g.fillRect(c - w * .7, c - w * .7, w * 1.4, w * 1.4);
      g.fillStyle = css(HI); for (const [dx, dy] of [[-1, -1], [1, -1], [-1, 1], [1, 1]]) g.fillRect(c + dx * w * .3 - s / 64, c + dy * w * .3 - s / 64, s / 32, s / 32); }],
  ['J', 'Runic cell', 'A storage cell drawn big, with the sigil glowing in its window: storage first, runes second.', (g, s) => { tile(g, s); glow(g, s / 2, s / 2, s * .38, .22);
      g.fillStyle = '#0f1215'; g.fillRect(s * .26, s * .12, s * .48, s * .76); g.fillStyle = '#5a5f67'; g.fillRect(s * .28, s * .14, s * .44, s * .72); g.fillStyle = '#7a7f87'; g.fillRect(s * .28, s * .14, s * .44, s * .06);
      g.fillStyle = '#c4c7cc'; g.fillRect(s * .4, s * .78, s * .2, s * .05); flat(g, s, s * .36 / 16, s * .32, s * .26, [true, true, true, true]); }],
];

const g = document.getElementById("c").getContext("2d");
tile(g, 512, '#23272d'); const p = 512 / 15; text(g, "MT", 256 - 5.5 * p, 256 - 3.5 * p, p, css(MID), "#121519"); g.fillStyle = css(HI); g.fillRect(256 - 5.5 * p, 256 - 3.5 * p, p, p);
</script>
