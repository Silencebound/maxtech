name: Guide site

# Builds the guide website and publishes it on GitHub Pages (https://silencebound.github.io/maxtech/).
# How the site is built: the guides section of build-logic/src/main/kotlin/maxtech.neoforge.gradle.kts. Never runs for
# pull requests.
# Runs on GitHub-hosted Ubuntu, which ships xvfb and Mesa; the job installs them if an image lacks them.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

# One deployment at a time; a newer release waits instead of cancelling one that is half deployed.
concurrency:
  group: guide-site
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Runner has xvfb-run
        # The export starts a game client, which needs a display; the runner has none.
        run: |
          if ! command -v xvfb-run > /dev/null 2>&1 || ! dpkg -s libgl1-mesa-dri > /dev/null 2>&1; then
            sudo apt-get update -q && sudo apt-get install -y -q xvfb libgl1-mesa-dri || true
          fi
          if ! command -v xvfb-run > /dev/null 2>&1; then
            echo "::error::xvfb-run is missing on this runner and could not be installed (apt: xvfb libgl1-mesa-dri)."
            exit 1
          fi

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        # Caches the Gradle home through the Actions cache, as build.yml does on hosted runners.
        uses: gradle/actions/setup-gradle@v6

      # The export renders icons and scenes in software OpenGL (Mesa llvmpipe) on a virtual display.
      - name: Export the guide
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          rm -rf runs/storage-neoforge/exportGuide/logs
          xvfb-run --auto-servernum --server-args='-screen 0 1280x720x24' \
            ./gradlew :storage:neoforge:runExportGuide --no-daemon

      - name: Build the website
        run: ./gradlew :storage:neoforge:createGuideWebsite --no-daemon

      - name: Check the export and the site
        run: bash .github/scripts/guide-site-check.sh

      - name: Export log
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: guide-export-log
          path: runs/storage-neoforge/exportGuide/logs/latest.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload the site
        uses: actions/upload-pages-artifact@v5
        with:
          path: storage/neoforge/build/guideWebsite

  deploy:
    needs: build
    # The private development repository never publishes; only the public copy does.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
