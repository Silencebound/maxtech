<!DOCTYPE html>
<!-- Licence: modified copy of GuideME's template (LGPLv3, https://github.com/AppliedEnergistics/GuideME).
     GuideME 26.1.15-beta's layout.html (guideme/internal/web/default-assets/templates), with MaxTech Storage's title,
     logo and favicon instead of the hard-coded AE2 ones. Used by :storage:neoforge:createGuideWebsite. -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- GuideME's plain-text title placeholder names AE2's guide and the page title placeholder is HTML, so the
         script at the end sets the tab title from the page heading. -->
    <title>MaxTech Storage guide</title>
    <link rel="icon" type="image/png" href="{{RELATIVE_PATH_TO_ROOT}}assets/maxtech_storage_logo.png">
    <link rel="stylesheet" href="{{RELATIVE_PATH_TO_ROOT}}assets/bundle-IRSJDK6M.css">
</head>
<body>

<main>
<div class="topLogoBar">
    <a href="{{RELATIVE_PATH_TO_ROOT}}index.html" class="logo">
        <img src="{{RELATIVE_PATH_TO_ROOT}}assets/maxtech_storage_logo.png" alt="" />
        MaxTech Storage
    </a>
    <!-- burger menu used on mobile devices when the actual navigation bar is hidden -->
    <a
            role="button"
            class="navbar-burger"
            aria-label="menu"
    >
    <span aria-hidden="true"></span>
    <span aria-hidden="true"></span>
    <span aria-hidden="true"></span>
    </a>
</div>
<div class="page-title">{{PAGE_TITLE}}</div>
<aside>
    <span class="search-slot"></span>
    {{GUIDE_NAVBAR}}
</aside>
<article>
    <div id="page-content">
        {{PAGE_CONTENT}}
    </div>
</article>
{{FOOTER}}
</main>
<script>document.title = document.querySelector(".page-title").textContent.trim() + " - " + document.title;</script>
<script src="{{RELATIVE_PATH_TO_ROOT}}assets/bundle-FVCODRC2.js" defer type="module"></script>
</body>
</html>
